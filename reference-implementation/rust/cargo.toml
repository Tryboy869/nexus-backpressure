[package]
name = "nexus-backpressure"
version = "1.0.0"
edition = "2021"
authors = ["Tryboy869 (Nexus Studio 100) <nexusstudio100@gmail.com>"]
description = "Universal Backpressure Protocol for Distributed Systems"
license = "Apache-2.0"
repository = "https://github.com/Tryboy869/nexus-backpressure"
homepage = "https://github.com/Tryboy869/nexus-backpressure"
keywords = ["backpressure", "distributed-systems", "flow-control", "protocol"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "nexus"
path = "main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1