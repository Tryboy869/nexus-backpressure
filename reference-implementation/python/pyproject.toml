[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-backpressure"
version = "1.0.0"
description = "Universal Backpressure Protocol for Distributed Systems"
authors = [
    {name = "Anzize Daouda", email = "anzize@nexus.dev"}
]
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
keywords = ["backpressure", "distributed-systems", "flow-control", "protocol"]

[tool.setuptools]
packages = []

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false